name: Release

# Builds the one-click native installers when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Everything here is free: GitHub-hosted runners, PyInstaller, Inno Setup, appimagetool, hdiutil, makeappx.
# Windows code signing is configured through SignPath Foundation and switches itself on once the SIGNPATH_* secrets and
# variables exist; until then the Windows files ship unsigned, exactly as before.
# The Windows job also builds the Microsoft Store upload (.msixupload) and, when signing is set up, a signed .msix.
#
# Every installer bundles every runtime feature: [all] + [train] (CPU-only torch, onnx), tkinter,
# PortAudio, MediaPipe/Whisper/Silero assets. AWAY_SPEC_STRICT=1 fails the PyInstaller build if a
# package is missing, and `selftest` (a hidden command) fails the job if a feature does not load
# inside the frozen app. Parakeet/NeMo is intentionally not bundled (docs/INSTALL.md).
#
# macOS-only release (v0.1.35): put [macos-only] in an annotated tag's message, e.g.
#   git tag -a v0.1.35 -m "[macos-only] Mac fixes" && git push origin v0.1.35
# Only the Mac app is built and published (no Windows/Linux installers, no PyPI upload). Windows and Linux copies
# skip a release without their installer (updater.check), so they are not offered it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu
  AWAY_SPEC_STRICT: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      macos_only: ${{ steps.p.outputs.macos_only }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
            if [[ "$obj" == tag\ * ]]; then msg=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${obj#tag }" --jq .message); fi
          fi
          if [[ "$msg" == *"[macos-only]"* ]]; then v=true; else v=false; fi
          echo "macos_only=$v" | tee -a "$GITHUB_OUTPUT"

  python-dist:
    needs: plan
    if: needs.plan.outputs.macos_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*

  pypi:
    # Separate job so a PyPI hiccup never blocks the installer release. Tags only: a manual run never publishes.
    needs: python-dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC), no token secret needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true  # re-running a tag never fails on an already-uploaded version

  linux:
    needs: plan
    if: needs.plan.outputs.macos_only != 'true'
    runs-on: ubuntu-22.04  # older glibc => the bundle runs on more distros
    env:
      AWAY_DATA_DIR: ${{ github.workspace }}/smoke/data
      AWAY_CONFIG_DIR: ${{ github.workspace }}/smoke/config
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release version (the tag without its v; 0.0.0-dev for a manual run from a branch)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "AWAY_REL_VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System libraries (PortAudio and Tk are bundled into the app; xvfb for GUI smoke tests)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libtk8.6 libegl1 libgl1 libxtst6 xvfb binutils
      - name: Install every feature (CPU-only torch)
        run: |
          pip install torch --index-url "$TORCH_CPU_INDEX"
          pip install ".[all,train]" pyinstaller
          python -c "import torch; assert not torch.backends.cuda.is_built(), 'CUDA torch slipped in'; print(torch.__version__)"
      - name: PyInstaller (strict; under Xvfb so pynput/pystray can be analysed)
        run: AWAY_VERSION="$AWAY_REL_VERSION" xvfb-run -a pyinstaller packaging/pyinstaller/away.spec --noconfirm
      - name: Smoke-test the frozen app
        run: |
          set -e
          APP=dist/ProjectAway/ProjectAway
          xvfb-run -a $APP --version
          xvfb-run -a $APP doctor
          xvfb-run -a $APP demo
          xvfb-run -a $APP selftest --json selftest.json
          python scripts/check_selftest.py selftest.json
          # non-interactive model download inside the frozen app (tiny Whisper keeps CI fast)
          $APP setup --yes --skip-probe --asr-model tiny < /dev/null
          python scripts/check_selftest.py --models "$AWAY_DATA_DIR/models" --asr tiny
      - run: bash packaging/linux/build_appimage.sh "$AWAY_REL_VERSION"
      - run: bash packaging/linux/build_deb.sh "$AWAY_REL_VERSION"
      - name: Smoke-test the AppImage and the .deb
        run: |
          set -e
          chmod +x dist/*.AppImage
          xvfb-run -a dist/*.AppImage --appimage-extract-and-run selftest --json appimage.json
          python scripts/check_selftest.py appimage.json
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a /usr/bin/away selftest --json deb.json
          python scripts/check_selftest.py deb.json
      - name: Release asset size limit (GitHub allows 2 GB per file)
        run: python scripts/check_selftest.py --max-size-mb 1900 dist/*.AppImage dist/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb

  windows:
    needs: plan
    if: needs.plan.outputs.macos_only != 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read  # SignPath's action downloads the unsigned workflow artifacts
    env:
      # true only on a version tag once SignPath is set up; otherwise every signing step is skipped
      SIGNPATH_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_POLICY_SLUG != '' }}
      AWAY_DATA_DIR: ${{ github.workspace }}\smoke\data
      AWAY_CONFIG_DIR: ${{ github.workspace }}\smoke\config
      AWAY_LOG_FILE: ${{ github.workspace }}\smoke\away.log
      AWAY_NO_CONSOLE: "1"  # windowed exe: write output to AWAY_LOG_FILE instead of opening a console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install every feature (CPU-only torch)
        run: |
          pip install torch --index-url $env:TORCH_CPU_INDEX
          pip install ".[all,train]" pyinstaller
          python -c "import torch; assert not torch.backends.cuda.is_built(), 'CUDA torch slipped in'; print(torch.__version__)"
      - name: Remove pywinrt's old msvcp140.dll (14.29; onnxruntime needs the system VC++ 2022 copy)
        shell: pwsh
        run: |
          # Windows keeps the first msvcp140.dll a process loads; with winrt's old copy first, importing onnxruntime
          # crashes (access violation), including inside PyInstaller's analysis. The system copy serves both.
          $dll = python -c "import pathlib, importlib.util as u; print(pathlib.Path(u.find_spec('winrt._winrt').origin).parent / 'msvcp140.dll')"
          if (Test-Path $dll) { Remove-Item $dll; Write-Host "removed $dll" }
          python -c "import winrt.windows.media.capture, onnxruntime; print('winrt then onnxruntime: ok', onnxruntime.__version__)"
      - name: PyInstaller (strict)
        shell: pwsh
        run: |
          $env:AWAY_VERSION = if ($env:GITHUB_REF.StartsWith("refs/tags/v")) { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          pyinstaller packaging/pyinstaller/away.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test the frozen app (windowed exe, no stdin)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          function Run-Away([string[]]$a) {
            $p = Start-Process -FilePath dist\ProjectAway\ProjectAway.exe -ArgumentList $a -Wait -PassThru -NoNewWindow
            if (Test-Path $env:AWAY_LOG_FILE) { Get-Content $env:AWAY_LOG_FILE; Remove-Item $env:AWAY_LOG_FILE }
            if ($p.ExitCode -ne 0) { throw "ProjectAway.exe $a exited $($p.ExitCode)" }
          }
          Run-Away @("--version")
          Run-Away @("doctor")
          Run-Away @("demo")
          Run-Away @("selftest", "--json", "selftest.json")
          python scripts/check_selftest.py selftest.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Run-Away @("setup", "--yes", "--skip-probe", "--asr-model", "tiny")
          python scripts/check_selftest.py --models "$env:AWAY_DATA_DIR\models" --asr tiny
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smart cleanup engine in the frozen app (download + load in its own process; non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          function Run-Away([string[]]$a) {
            $p = Start-Process -FilePath dist\ProjectAway\ProjectAway.exe -ArgumentList $a -Wait -PassThru -NoNewWindow
            if (Test-Path $env:AWAY_LOG_FILE) { Get-Content $env:AWAY_LOG_FILE; Remove-Item $env:AWAY_LOG_FILE }
            if ($p.ExitCode -ne 0) { throw "ProjectAway.exe $a exited $($p.ExitCode)" }
          }
          Run-Away @("cleanup-engine", "install")
          Run-Away @("cleanup-engine", "check")
          Run-Away @("cleanup-engine", "remove")
      - name: Release version (empty when this is not a tag build)
        id: ver
        shell: pwsh
        run: |
          $v = ""
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "signing: $env:SIGNPATH_ENABLED  version: '$v'"
      # ---- SignPath 1/2: sign ProjectAway.exe itself, before it goes into the installer and the MSIX
      - name: "SignPath: upload the unsigned ProjectAway.exe"
        id: unsigned-app
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-unsigned-app
          path: dist/ProjectAway/ProjectAway.exe
          retention-days: 1
      - name: "SignPath: sign ProjectAway.exe (approve the request on signpath.io)"
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIG_SLUG || 'app-exe' }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ vars.SIGNPATH_WAIT_SECONDS || '3600' }}
          output-artifact-directory: signed/app
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
      - name: "SignPath: use the signed ProjectAway.exe"
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed\app\ProjectAway.exe
          if ($sig.Status -ne 'Valid') { throw "signed ProjectAway.exe is not valid: $($sig.Status) $($sig.StatusMessage)" }
          Copy-Item signed\app\ProjectAway.exe dist\ProjectAway\ProjectAway.exe -Force
          Write-Host "ProjectAway.exe signed by $($sig.SignerCertificate.Subject)"
      - name: Build installer with Inno Setup (preinstalled on windows-latest)
        shell: pwsh
        run: |
          $v = "0.0.0-dev"
          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\away.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test the installer (silent, models unticked to keep CI fast)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe)[0].FullName
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\ProjectAway\ProjectAway.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList 'selftest','--json','installed.json' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "installed selftest exited $($p.ExitCode)" }
          python scripts/check_selftest.py installed.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/check_selftest.py --max-size-mb 1900 $setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: MSIX packages (Store upload always; a sideload .msix too once signing is set up)
        # v0.1.25: a failed MSIX build must never block the normal installer release (it is an extra asset)
        continue-on-error: true
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_SIDELOAD_PUBLISHER: ${{ env.SIGNPATH_ENABLED == 'true' && vars.MSIX_SIDELOAD_PUBLISHER || '' }}
        run: |
          $a = @("scripts/build_msix.py", "--input", "dist\ProjectAway", "--out", "dist")
          if ("${{ steps.ver.outputs.version }}") { $a += @("--version", "${{ steps.ver.outputs.version }}") }
          python @a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pk = (Get-ChildItem dist\*.msixupload, dist\*-windows-x64.msix -ErrorAction SilentlyContinue).FullName
          python scripts/check_selftest.py --max-size-mb 1900 $pk
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # ---- SignPath 2/2: sign the installer and the sideload MSIX (both already contain the signed exe)
      - name: "SignPath: upload the unsigned installer and sideload MSIX"
        id: unsigned-release
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-unsigned-release
          path: |
            dist/*-setup.exe
            dist/*-windows-x64.msix
          retention-days: 1
      - name: "SignPath: sign the installer and MSIX (approve the request on signpath.io)"
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_RELEASE_CONFIG_SLUG || 'release' }}
          github-artifact-id: ${{ steps.unsigned-release.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ vars.SIGNPATH_WAIT_SECONDS || '3600' }}
          output-artifact-directory: signed/release
          parameters: |
            version: "${{ steps.ver.outputs.version }}"
      - name: "SignPath: use the signed installer and MSIX"
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem signed\release -File) {
            if ($f.Extension -eq ".exe") {
              $sig = Get-AuthenticodeSignature $f.FullName
              if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.Status)" }
            } else {
              python -c "import sys, zipfile; sys.exit(0 if 'AppxSignature.p7x' in zipfile.ZipFile(sys.argv[1]).namelist() else 1)" $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "$($f.Name) has no AppxSignature.p7x" }
            }
            Copy-Item $f.FullName dist\ -Force
            Write-Host "signed: $($f.Name)"
          }
      # uploaded after signing, so the release (and SHA256SUMS.txt, made from these files) has the signed copies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/*.msixupload
            dist/*-windows-x64.msix

  macos:
    runs-on: macos-14  # Apple Silicon; Intel Macs: use `pipx install "project-away[all,train]"`
    env:
      AWAY_DATA_DIR: ${{ github.workspace }}/smoke/data
      AWAY_CONFIG_DIR: ${{ github.workspace }}/smoke/config
      AWAY_LOG_FILE: ${{ github.workspace }}/smoke/away.log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Release version (the tag without its v; 0.0.0-dev for a manual run from a branch)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "AWAY_REL_VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install every feature (CPU-only torch)
        run: |
          pip install torch --index-url "$TORCH_CPU_INDEX"
          pip install ".[all,train]" pyinstaller
          python -c "import torch; assert not torch.backends.cuda.is_built(), 'CUDA torch slipped in'; print(torch.__version__)"
      - name: PyInstaller (strict)
        run: AWAY_VERSION="$AWAY_REL_VERSION" pyinstaller packaging/pyinstaller/away.spec --noconfirm
      - name: Exactly one libavdevice (PyAV is left out of the macOS bundle, see away.spec)
        # two copies define the same Objective-C classes and macOS warns of "mysterious crashes"
        run: |
          find dist/ProjectAway.app -type f -name 'libavdevice*' -print
          n=$(find dist/ProjectAway.app -type f -name 'libavdevice*' | wc -l | tr -d ' ')
          if [ "$n" != "1" ]; then echo "::error::expected exactly one libavdevice in the app, found $n"; exit 1; fi
          if [ -e dist/ProjectAway.app/Contents/Frameworks/av ]; then echo "::error::PyAV (Frameworks/av) is in the app"; exit 1; fi
      - name: Smoke-test the frozen app
        run: |
          set -e
          mkdir -p smoke
          APP=dist/ProjectAway.app/Contents/MacOS/ProjectAway
          show() { [ -f "$AWAY_LOG_FILE" ] && cat "$AWAY_LOG_FILE" && rm -f "$AWAY_LOG_FILE" || true; }
          $APP --version; show
          $APP doctor; show
          $APP demo; show
          $APP selftest --json selftest.json; show
          python scripts/check_selftest.py selftest.json
          $APP setup --yes --skip-probe --asr-model tiny < /dev/null; show
          python scripts/check_selftest.py --models "$AWAY_DATA_DIR/models" --asr tiny
      - name: Signing certificate (v0.1.35; a fixed identity keeps macOS permissions across updates)
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::MAC_SIGN_P12 secret missing"; exit 1; fi
            echo "::warning::no MAC_SIGN_P12 secret: ad-hoc signature"; exit 0
          fi
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          kc=$(bash packaging/macos/import_signing_cert.sh "$RUNNER_TEMP/signing.p12" "$MAC_SIGN_P12_PASSWORD" "$RUNNER_TEMP/away-signing.keychain-db")
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "MAC_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "MAC_SIGN_IDENTITY=Project Away Self-Signed" >> "$GITHUB_ENV"
      - run: bash packaging/macos/build_dmg.sh "$AWAY_REL_VERSION"
      - name: Release asset size limit (GitHub allows 2 GB per file)
        run: python scripts/check_selftest.py --max-size-mb 1900 dist/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  publish:
    needs: [plan, python-dist, linux, windows, macos]
    # every build passed, or a macOS-only release and its Mac build passed (the skipped jobs then count as fine)
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.macos.result == 'success' &&
      (needs.plan.outputs.macos_only == 'true' ||
       (needs.python-dist.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: packaging/release-install-notes.md
          sparse-checkout-cone-mode: false
      - name: How-to-install notes for the release page (the file names carry this version)
        run: |
          sed "s/<version>/${GITHUB_REF_NAME#v}/g" packaging/release-install-notes.md > install-notes.md
          if [ "${{ needs.plan.outputs.macos_only }}" = "true" ]; then
            printf '\n**macOS only.** Windows and Linux stay on the previous release.\n' >> install-notes.md
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
          # the release artifacts only: signpath-unsigned-* hold the UNSIGNED copies sent to SignPath
          pattern: "{python-dist,linux-installers,windows-installer,macos-dmg}"
      - name: SHA256SUMS.txt for every asset (the in-app updater verifies downloads against it)
        # hashes the files exactly as published, i.e. the SignPath-signed Windows files when signing is on
        run: |
          set -e
          cd out
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Published (not a draft) so `away update` and the tray updater see it. Safe because this job only
          # runs after python-dist, linux, windows and macos all passed (needs:), including the installer smoke tests.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.2.0-rc.1 -> pre-release (beta channel only)
