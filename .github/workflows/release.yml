name: Release

# Builds native installers when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Everything here is free: GitHub-hosted runners, PyInstaller, Inno Setup, appimagetool, hdiutil.
# Nothing is code-signed (no paid certificates): see docs/INSTALL.md for the one-time OS prompts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-dist:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
      - name: Publish to PyPI (only if a PYPI_API_TOKEN secret exists)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        run: pip install twine && twine upload -u __token__ -p "$PYPI_API_TOKEN" dist/*

  linux:
    runs-on: ubuntu-22.04  # older glibc => the bundle runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libgl1 libxtst6
      - run: pip install ".[all]" pyinstaller
      - run: pyinstaller packaging/pyinstaller/away.spec --noconfirm
      - name: Smoke-test the frozen app
        run: |
          dist/ProjectAway/ProjectAway --version
          dist/ProjectAway/ProjectAway demo
      - run: bash packaging/linux/build_appimage.sh "${GITHUB_REF_NAME#v}"
      - run: bash packaging/linux/build_deb.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.AppImage
            dist/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[all]" pyinstaller
      - run: pyinstaller packaging/pyinstaller/away.spec --noconfirm
      - name: Smoke-test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ProjectAway\ProjectAway.exe -ArgumentList "demo" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Build installer with Inno Setup (preinstalled on windows-latest)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not $v -or $v -eq "${{ github.ref_name }}") { $v = "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\away.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe

  macos:
    runs-on: macos-14  # Apple Silicon; Intel Macs: use `pipx install "project-away[all]"`
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[all]" pyinstaller
      - run: pyinstaller packaging/pyinstaller/away.spec --noconfirm
      - name: Smoke-test the frozen app
        run: dist/ProjectAway.app/Contents/MacOS/ProjectAway demo
      - run: bash packaging/macos/build_dmg.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  publish:
    needs: [python-dist, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true  # review, then publish the release by hand
          files: out/*
