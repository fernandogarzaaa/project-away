name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,agent]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # [winrt] installs the pywinrt camera packages on Windows only (environment markers); elsewhere nothing
      - run: pip install -e ".[dev,winrt,agent]" Pillow opencv-python-headless
      - name: Core tests (torch tests self-skip without the [train] extra)
        env:
          AWAY_NET_TESTS: "1"  # v0.1.20: download + load the pinned Smart cleanup engine on every OS
        run: pytest -p no:warnings --cov=away --cov-report=term-missing:skip-covered

  gpu-windows:
    # v0.1.24: GPU hand/face tracking through ONNX Runtime + DirectML. Allowed to fail while it settles. GitHub's
    # Windows runners have no DirectX 12 graphics card: the DirectML runtime loads but finds no device, so this proves
    # the provider installs, the pinned models download and run, and the app falls back to the processor with a note.
    # It says nothing about speed on a real card. The installer still ships plain onnxruntime (unchanged on purpose).
    name: GPU tracking (Windows, onnxruntime-directml, allowed to fail)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" opencv-python-headless onnxruntime-directml
      - run: python -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"
      - name: GPU tracking tests (real model download + DirectML session)
        env:
          AWAY_NET_TESTS: "1"
          AWAY_EXPECT_DML: "1"
        run: pytest tests/test_v0124_gpu.py -p no:warnings -v -s

  train:
    name: train/export (torch CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest tests/test_train_torch.py tests/test_studio_torch.py -p no:warnings

  wheel:
    name: wheel installs in a clean venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/away --version
          /tmp/clean/bin/away demo
          /tmp/clean/bin/away doctor
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  msix:
    # The real MSIX is built from the full PyInstaller app in release.yml; this proves on every PR, in a few minutes,
    # that away.spec's Windows version resource/icon, the manifest, makepri and makeappx work, and that a signed
    # sideload package installs (self-signed test certificate, trusted only on this throwaway runner).
    name: MSIX package (makeappx, test install)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . Pillow pyinstaller
      - name: Stand-in app with the release exe's version resource and icon
        run: python packaging/msix/ci_standin.py standin
      - name: Version resource is what SignPath checks
        shell: pwsh
        run: |
          $vi = (Get-Item standin\ProjectAway\ProjectAway.exe).VersionInfo
          Write-Host "$($vi.ProductName) $($vi.ProductVersion) / $($vi.FileVersion)"
          if ($vi.ProductName -ne "Project Away") { throw "ProductName is '$($vi.ProductName)'" }
          $v = python -c "import sys; sys.path.insert(0, 'scripts'); import build_msix; print(build_msix.pyproject_version())"
          if ($vi.ProductVersion -ne $v) { throw "ProductVersion '$($vi.ProductVersion)' is not '$v'" }
      - name: Build the Store upload and a sideload MSIX
        run: python scripts/build_msix.py --input standin\ProjectAway --out msix-out --publisher "CN=ProjectAway-CI" --sideload-publisher "CN=Project Away CI Test"
      - name: Sign the sideload MSIX with a throwaway certificate, install it, check alias and startup task, remove it
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $up = Get-ChildItem msix-out\*.msixupload
          python -c "import sys, zipfile; n = zipfile.ZipFile(sys.argv[1]).namelist(); print(n); sys.exit(0 if len(n) == 1 and n[0].endswith('-store.msix') else 1)" $up.FullName
          if ($LASTEXITCODE -ne 0) { throw "bad .msixupload" }
          $msix = (Get-ChildItem msix-out\*-windows-x64.msix).FullName
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Project Away CI Test" -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "ci-only" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath ci.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath ci.cer | Out-Null
          Import-Certificate -FilePath ci.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = (Get-ChildItem $kit -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f ci.pfx /p ci-only $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Add-AppxPackage -Path $msix
          $pkg = Get-AppxPackage -Name FernandoGarza.ProjectAway
          if (-not $pkg) { throw "not installed" }
          Write-Host "installed $($pkg.PackageFullName) $($pkg.Version)"
          $m = [xml](Get-Content (Join-Path $pkg.InstallLocation "AppxManifest.xml"))
          $caps = $m.Package.Capabilities.ChildNodes | ForEach-Object { $_.Name }
          foreach ($c in "internetClient", "privateNetworkClientServer", "runFullTrust", "webcam", "microphone") {
            if ($caps -notcontains $c) { throw "capability $c missing: $caps" }
          }
          if (-not (Test-Path (Join-Path $pkg.InstallLocation "resources.pri"))) { throw "no resources.pri" }
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\away.exe"
          if (-not (Test-Path $alias)) { throw "app execution alias missing: $alias" }
          $task = $m.Package.Applications.Application.Extensions.Extension | Where-Object { $_.Category -eq "windows.startupTask" }
          if ($task.StartupTask.Enabled -ne "false") { throw "startup task must be off by default" }
          Remove-AppxPackage -Package $pkg.PackageFullName
          Write-Host "MSIX install/remove OK"

  mutation:
    # Blocking check: a failed group fails the workflow, and the summary fails
    # on any missing report or any group below --fail-under. This is intentional:
    # a cancelled or silently skipped mutation run is not an acceptable signal.
    name: mutation ${{ matrix.group }} (testteeth)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with GROUPS in scripts/mutation.py
        # (verify with: python scripts/mutation.py --list-groups)
        group:
          - filters
          - landmarks
          - gestures
          - cursor
          - cleanup
          - vad
          - dictation
          - wifi_features
          - wifi_classifier
          - face
          - fusion_events
          - autoscroll
          - crashlog
          - tunables
          - autotune
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" "testteeth>=0.2,<0.3"
      - run: python scripts/mutation.py ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.group }}
          path: .testteeth-reports/${{ matrix.group }}.json
          if-no-files-found: warn

  mutation-summary:
    name: mutation score (testteeth)
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: download mutation reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .testteeth-reports
          # Group list comes from scripts/mutation.py itself, so adding a group
          # there can never silently drop out of the aggregate.
          groups=$(python3 scripts/mutation.py --list-groups | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))")
          missing=""
          for g in $groups; do
            if ! gh run download ${{ github.run_id }} -n "mutation-$g" -D .testteeth-reports; then
              echo "::warning::no mutation artifact for group $g"
              missing="$missing $g"
            fi
          done
          ls .testteeth-reports/
          if [ -n "$missing" ]; then
            echo "missing mutation reports for groups:$missing"
            exit 1
          fi
      - run: python3 scripts/mutation.py --summary --fail-under 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: .testteeth-reports/
          if-no-files-found: warn
