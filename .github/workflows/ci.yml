name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # [winrt] installs the pywinrt camera packages on Windows only (environment markers); elsewhere nothing
      - run: pip install -e ".[dev,winrt]" Pillow opencv-python-headless
      - name: Core tests (torch tests self-skip without the [train] extra)
        run: pytest -p no:warnings --cov=away --cov-report=term-missing:skip-covered

  train:
    name: train/export (torch CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest tests/test_train_torch.py -p no:warnings

  wheel:
    name: wheel installs in a clean venv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/away --version
          /tmp/clean/bin/away demo
          /tmp/clean/bin/away doctor
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  mutation:
    name: mutation score (testteeth, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" "testteeth>=0.2,<0.3"
      - run: python scripts/mutation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-reports
          path: .testteeth-reports/
