ShortDescription: Control your PC and your AI agents with your hands, face and voice. Processed on your PC.
Description: |-
  Project Away turns your webcam and microphone into a hands-free way to use your computer: point to move the
  pointer, pinch to click, talk to type. It also connects to the AI agent you already use (Claude, ChatGPT, Cursor
  and others) so the agent can ask you quick questions you answer with a gesture. Camera and microphone are
  processed on your PC; nothing is sent anywhere unless you connect an agent and allow it.
