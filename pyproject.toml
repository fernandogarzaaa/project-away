[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-away"
version = "0.1.29"
description = "The bridge between you and your AI agents, controlled by your hands, face and voice: hands-free PC control, dictation, Agent Link (MCP) and more. Local-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }]
keywords = ["gesture", "hand-tracking", "mediapipe", "dictation", "whisper", "accessibility", "wifi-csi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Desktop Environment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core stays lean: pure numpy/scipy logic + YAML config. Everything that needs
# a camera, a mic, a GPU or a desktop session is an extra.
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
hands = ["mediapipe>=0.10.14", "opencv-python>=4.8", "onnxruntime>=1.17"]
# v0.1.19: the WinRT MediaCapture camera backend (Windows only; the API the Windows Camera app uses)
winrt = [
  "winrt-runtime>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Devices.Enumeration>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Capture>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Capture.Frames>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media.MediaProperties>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]
face = ["mediapipe>=0.10.14", "opencv-python>=4.8"]
# v0.1.20 smart pointer: Windows UI Automation (snap to buttons, "click <name>"); nothing on other systems
pointer = ["comtypes>=1.2; sys_platform == 'win32'"]
# Silero VAD comes from the ONNX model bundled in faster-whisper (no torch needed)
# pycaw (Windows only, v0.1.22): which other apps are playing sound, so a video in the background is not typed
voice = ["faster-whisper>=1.1", "sounddevice>=0.4.6", "pycaw>=20240210; sys_platform == 'win32'"]
control = ["pynput>=1.7.6", "pyperclip>=1.8"]
tray = ["pystray>=0.19", "Pillow>=10"]
# v0.1.20 Agent Link: connect AI agents (MCP over stdio + Streamable HTTP, REST), QR pairing, UI Automation
agent = [
  "mcp>=1.26,<2",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "qrcode>=7.4",
  "keyring>=24",
  "uiautomation>=2.0.20; sys_platform == 'win32'",
]
train = ["torch>=2.1", "onnx>=1.15", "onnxruntime>=1.17"]
parakeet = ["nemo_toolkit[asr]>=2.0"]
# v0.1.20 Smart cleanup engine (voice.cleanup.mode: llm). Not in [all]: it builds llama.cpp from source where no
# wheel exists. GPU builds: see README "Smart cleanup".
cleanup = ["llama-cpp-python>=0.3.2"]
# v0.1.24 newer models (optional; never in [all] or the installers - Settings can also fetch the first two as
# pinned, sha256-checked engines). Moonshine v2 streaming speech on the CPU (MIT):
moonshine = ["moonshine-voice>=0.1.5,<0.2"]
# livekit-wakeword (Apache-2.0) runs a "Hey <name>" model you trained; it needs Python 3.11 or newer
wakeword = ["livekit-wakeword>=0.3.0,<0.4; python_version >= '3.11'"]
# Kyutai pocket-tts instant voice (experimental; code MIT, weights CC-BY-4.0: credit Kyutai). Pulls in PyTorch.
pocket = ["pocket-tts>=3.2,<4"]
# Qwen3-TTS Base 0.6B custom voice cloning; optional and not bundled in installers.
qwen = ["qwen-tts>=0.1.1"]
all = [
  "mediapipe>=0.10.14", "opencv-python>=4.8", "onnxruntime>=1.17",
  "faster-whisper>=1.1", "sounddevice>=0.4.6", "pycaw>=20240210; sys_platform == 'win32'",
  "pynput>=1.7.6", "pyperclip>=1.8",
  "pystray>=0.19", "Pillow>=10",
  # v0.1.20: pure-Python packages the downloadable Smart cleanup engine (llama-cpp-python) imports; bundled in
  # the installers so Settings' Download only has to fetch the engine wheel itself (away.voice.engine)
  "diskcache>=5.6.1", "jinja2>=3.1", "typing_extensions>=4.5",
  # the [pointer] extra (Windows only)
  "comtypes>=1.2; sys_platform == 'win32'",
  # the [agent] extra (Agent Link)
  "mcp>=1.26,<2", "uvicorn>=0.30", "starlette>=0.40", "qrcode>=7.4", "keyring>=24",
  "uiautomation>=2.0.20; sys_platform == 'win32'",
  # the [winrt] extra (Windows only)
  "winrt-runtime>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Devices.Enumeration>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Capture>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Capture.Frames>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media.MediaProperties>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]
# comtypes (Windows only): the smart pointer's real UI Automation smoke test runs on the Windows CI job
dev = [
  "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "types-PyYAML",
  "comtypes>=1.2; sys_platform == 'win32'",
  # the Smart cleanup engine's import-time dependencies (tests load the real downloaded engine on CI)
  "diskcache>=5.6.1", "jinja2>=3.1", "typing_extensions>=4.5",
]

[project.scripts]
away = "away.cli:main"

[project.gui-scripts]
away-tray = "away.app.tray:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/project-away"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
away = ["py.typed", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: slower tests (training loops, ONNX export)",
  "torch: needs the [train] extra",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059", "RUF005", "B017", "E501", "SIM115", "RUF015"]

[tool.mypy]
python_version = "3.10"
files = ["src/away"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["away.app.autostart"]
warn_unused_ignores = false
disable_error_code = ["attr-defined"]

[tool.testteeth]
paths = [
  "src/away/hands/filters.py",
  "src/away/hands/landmarks.py",
  "src/away/hands/gestures.py",
  "src/away/hands/cursor.py",
  "src/away/voice/cleanup.py",
  "src/away/voice/vad.py",
  "src/away/wifi/features.py",
  "src/away/wifi/classifier.py",
  "src/away/face/speaking.py",
  "src/away/face/speaker.py",
  "src/away/face/commands.py",
  "src/away/fusion.py",
  "src/away/events.py",
]
test_args = ["tests", "-m", "not slow and not torch", "-x", "-q", "-p", "no:cacheprovider"]
